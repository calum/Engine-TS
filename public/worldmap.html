<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>World Map</title>
    <style>
        html, body { margin: 0; background: #000; overflow: hidden; }
        canvas { display: block; }
        #search { position: absolute; top: 8px; left: 8px; width: 240px; font: 13px sans-serif; }
        #q { box-sizing: border-box; width: 100%; padding: 5px 7px; border: 1px solid #000; background: #fff; color: #000; }
        #results { margin: 2px 0 0; padding: 0; list-style: none; background: rgba(0, 0, 0, 0.85); color: #fff; max-height: 320px; overflow-y: auto; }
        #results li { padding: 4px 7px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
        #results li:hover, #results li.sel { background: #5a4a14; }
        #results .meta { color: #bbb; white-space: nowrap; }
        #hint { margin-top: 2px; color: #ddd; text-shadow: 1px 1px #000; font-size: 11px; }
    </style>
</head>
<body>
    <canvas id="canvas" width="900" height="600"></canvas>
    <div id="search">
        <input id="q" type="text" placeholder="Search NPCs, items, objects (e.g. mithril, giant, knife)" autocomplete="off" spellcheck="false">
        <ul id="results"></ul>
        <div id="hint">Locs use internal names (rocks: mithrilrock1). Items: ground spawns only.</div>
    </div>
    <script type="module">
        import { MapView } from './client/mapview.js';

        window.mapview = new MapView();

        const q = document.getElementById('q');
        const list = document.getElementById('results');
        const hint = document.getElementById('hint');
        let results = [];
        let timer = 0;

        function show() {
            list.innerHTML = '';
            results.forEach((r, i) => {
                const li = document.createElement('li');
                li.dataset.i = String(i);
                const name = document.createElement('span');
                name.textContent = r.entry.name;
                const meta = document.createElement('span');
                meta.className = 'meta';
                meta.textContent = r.entry.kind + ' · ' + r.count;
                li.append(name, meta);
                li.onclick = () => pick(i);
                list.appendChild(li);
            });
        }

        async function pick(i) {
            const r = results[i];
            if (!r) return;
            hint.textContent = r.entry.name + ': ' + r.count + ' spawn' + (r.count === 1 ? '' : 's') + ' (yellow rings). Esc clears.';
            await window.worldMapSearch.select(r.entry);
        }

        q.addEventListener('input', () => {
            clearTimeout(timer);
            timer = setTimeout(async () => {
                results = await window.worldMapSearch.query(q.value);
                show();
            }, 120);
        });
        q.addEventListener('keydown', e => {
            if (e.key === 'Enter') pick(0);
            if (e.key === 'Escape') {
                q.value = '';
                results = [];
                show();
                window.worldMapSearch.clear();
            }
        });
    </script>
</body>
</html>
